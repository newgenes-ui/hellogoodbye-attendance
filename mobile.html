<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헬로굿바이 - 모바일 현장 출퇴근</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-6 w-full max-w-md">
        <!-- 상단 헤더 -->
        <div class="flex items-center space-x-3 mb-6 border-b border-gray-100 pb-4">
            <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center shadow-sm">
                <span class="text-xl">🌻</span>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900 leading-tight">헬로굿바이</h1>
                <p class="text-xs text-gray-500">모바일 현장 출퇴근 기록기</p>
            </div>
        </div>

        <!-- 경고 메시지 (설정값 없을 때) -->
        <div id="setupWarning" class="hidden bg-red-50 border border-red-200 text-red-800 text-sm rounded-xl p-4 mb-6">
            <i class="fa-solid fa-circle-exclamation mr-1.5 text-red-600"></i>
            <strong>설정 정보가 없습니다.</strong><br>
            관리자에게 공유받은 고유 모바일 출퇴근 링크 주소 전체를 통해 다시 접속해 주세요.
        </div>

        <!-- 메인 입력 폼 영역 -->
        <div id="mainFormArea">
            <!-- 사원 이름 설정 영역 (최초 1회 노출) -->
            <div id="nameSetupArea" class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">본인의 이름을 입력하세요</label>
                <div class="flex gap-2">
                    <input type="text" id="employeeName" placeholder="예: 나혜원" 
                           class="flex-1 border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="saveName()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">
                        등록
                    </button>
                </div>
                <p class="text-xs text-gray-400 mt-1.5">이름은 최초 1회만 입력하시면 계속 저장됩니다.</p>
            </div>

            <!-- 출퇴근 버튼 영역 (이름 등록 후 상시 노출) -->
            <div id="actionArea" class="hidden">
                <div class="bg-blue-50 border border-blue-100 text-blue-900 rounded-xl p-3.5 mb-6 flex justify-between items-center">
                    <div>
                        <span class="text-xs font-semibold text-blue-500 uppercase tracking-wider block">현장 근무자</span>
                        <strong id="displayName" class="text-base text-blue-900"></strong>
                    </div>
                    <button id="btnResetName" onclick="resetName()" class="text-xs text-blue-600 hover:text-blue-800 underline">
                        이름 변경
                    </button>
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <!-- 현장 출근 버튼 -->
                    <button onclick="submitAttendance('현장출근')" 
                            class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-5 rounded-2xl shadow-md transition transform active:scale-95 flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-door-open text-2xl"></i>
                        <span class="text-lg">현장 출근하기</span>
                    </button>
                    
                    <!-- 현장 퇴근 버튼 -->
                    <button onclick="submitAttendance('현장퇴근')" 
                            class="bg-gray-800 hover:bg-gray-900 text-white font-semibold py-5 rounded-2xl shadow-md transition transform active:scale-95 flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-door-closed text-2xl"></i>
                        <span class="text-lg">현장 퇴근하기</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 성공 토스트/알림 피드백 -->
        <div id="toast" class="hidden mt-6 bg-green-50 border border-green-200 text-green-800 rounded-xl p-4 text-center">
            <i class="fa-solid fa-circle-check text-green-600 text-xl mb-1 block"></i>
            <span id="toastMsg" class="text-sm font-semibold"></span>
        </div>
    </div>

    <!-- CORS 방지용 숨겨진 iframe과 전송용 form -->
    <iframe name="invisible-iframe" id="invisible-iframe" class="hidden"></iframe>
    <form id="googleForm" target="invisible-iframe" method="POST" class="hidden"></form>

    <script>
        // 전역 설정값 객체
        let config = {
            formId: "",
            nameId: "",
            actionId: "",
            compId: ""
        };

         window.onload = function() {
            // 1. URL 쿼리 파라미터에서 설정값 읽기
            const params = new URLSearchParams(window.location.search);
            const pFormId = params.get("formId");
            const pNameId = params.get("nameId");
            const pActionId = params.get("actionId");
            const pCompId = params.get("compId");
            const pEmpName = params.get("employeeName");

            if (pFormId && pNameId && pActionId && pCompId) {
                // 쿼리 파라미터가 모두 있으면 localStorage에 새로 덮어쓰기 저장
                localStorage.setItem("m_form_id", pFormId);
                localStorage.setItem("m_name_id", pNameId);
                localStorage.setItem("m_action_id", pActionId);
                localStorage.setItem("m_comp_id", pCompId);
            }

            if (pEmpName) {
                // 사원 이름 파라미터가 들어오면 강제 세팅하고 변경 차단(Lock) 처리
                localStorage.setItem("m_employee_name", pEmpName.trim());
                localStorage.setItem("m_name_locked", "true");
            }

            // 2. localStorage에서 최종 설정값 복원
            config.formId = localStorage.getItem("m_form_id");
            config.nameId = localStorage.getItem("m_name_id");
            config.actionId = localStorage.getItem("m_action_id");
            config.compId = localStorage.getItem("m_comp_id");

            // 설정 정보가 누락된 경우 경고 문구 표시
            if (!config.formId || !config.nameId || !config.actionId || !config.compId) {
                document.getElementById("setupWarning").classList.remove("hidden");
                document.getElementById("mainFormArea").classList.add("hidden");
                return;
            }

            // 3. 이름 입력 여부에 따라 화면 구성
            showAppropriateView();
        };

        // 이름 등록 완료 처리
        function saveName() {
            const nameInput = document.getElementById("employeeName").value.trim();
            if (!nameInput) {
                alert("이름을 입력해 주세요.");
                return;
            }
            localStorage.setItem("m_employee_name", nameInput);
            showAppropriateView();
        }

        // 이름 초기화 및 변경 화면으로 전환
        function resetName() {
            if (localStorage.getItem("m_name_locked") === "true") {
                alert("이름이 관리자에 의해 고정되어 변경할 수 없습니다.");
                return;
            }
            localStorage.removeItem("m_employee_name");
            showAppropriateView();
        }

        // 상태별 뷰 노출 로직
        function showAppropriateView() {
            const savedName = localStorage.getItem("m_employee_name");
            const nameArea = document.getElementById("nameSetupArea");
            const actionArea = document.getElementById("actionArea");
            const displayName = document.getElementById("displayName");
            const btnResetName = document.getElementById("btnResetName");

            if (savedName) {
                nameArea.classList.add("hidden");
                actionArea.classList.remove("hidden");
                displayName.innerText = savedName;

                // 이름 변경 버튼 노출 차단 여부
                if (localStorage.getItem("m_name_locked") === "true") {
                    btnResetName.classList.add("hidden");
                } else {
                    btnResetName.classList.remove("hidden");
                }
            } else {
                nameArea.classList.remove("hidden");
                actionArea.classList.add("hidden");
                document.getElementById("employeeName").value = "";
            }
            document.getElementById("toast").classList.add("hidden");
        }

        // 구글 폼에 근태 제출 실행
        function submitAttendance(action) {
            const name = localStorage.getItem("m_employee_name");
            if (!name) {
                alert("등록된 이름이 없습니다. 다시 등록해 주세요.");
                showAppropriateView();
                return;
            }

            const form = document.getElementById("googleForm");
            form.action = `https://docs.google.com/forms/d/e/${config.formId}/formResponse`;
            form.innerHTML = ""; // 기존 입력값 초기화

            // 구글 폼 필드 구성
            const nameField = createHiddenInput(config.nameId, name);
            const actionField = createHiddenInput(config.actionId, action);
            const compField = createHiddenInput(config.compId, "Mobile (현장)");

            form.appendChild(nameField);
            form.appendChild(actionField);
            form.appendChild(compField);

            // 폼 제출
            form.submit();

            // 전송 완료 토스트 노출
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");
            toastMsg.innerHTML = `<strong>${name}</strong>님의 <strong>${action}</strong> 기록을<br>구글 스프레드시트에 전송했습니다!`;
            toast.classList.remove("hidden");

            // 4초 뒤 토스트 자동 숨김
            setTimeout(() => {
                toast.classList.add("hidden");
            }, 4000);
        }

        // hidden input 생성 헬퍼
        function createHiddenInput(name, value) {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = name;
            input.value = value;
            return input;
        }
    </script>
</body>
</html>
